name: Intake

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      NUM: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      PAGES_BASE: https://cavadind-davide.github.io/researcher-agent
    steps:
      - name: Autorisierung prüfen (nur Repo-Owner)
        id: auth
        run: |
          if [ "${{ github.event.issue.author_association }}" = "OWNER" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            gh issue comment "$NUM" --repo "$REPO" \
              --body "⛔ Nicht autorisiert – nur der Repo-Owner kann diese Aktion auslösen."
            gh issue close "$NUM" --repo "$REPO"
          fi

      - name: Aktion aus Label bestimmen
        id: action
        if: steps.auth.outputs.authorized == 'true'
        run: |
          action=$(jq -r '[.issue.labels[].name] | map(select(startswith("intake:"))) | (.[0] // "") | sub("^intake:";"")' "$GITHUB_EVENT_PATH")
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "Aktion: $action"

      - name: Checkout
        if: steps.auth.outputs.authorized == 'true'
        uses: actions/checkout@v7

      - name: Setup Python
        if: steps.auth.outputs.authorized == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Node.js (für Brave-Search-MCP via npx)
        if: steps.auth.outputs.authorized == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.auth.outputs.authorized == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Intake ausführen
        id: run
        if: steps.auth.outputs.authorized == 'true'
        env:
          INTAKE_ACTION: ${{ steps.action.outputs.action }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          if researcher intake > intake_output.txt 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          echo "----- intake output -----"
          cat intake_output.txt
          slug=$(grep -m1 '^SLUG:' intake_output.txt | sed 's/^SLUG:[[:space:]]*//' || true)
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Rendern + Änderungen committen
        if: steps.auth.outputs.authorized == 'true' && steps.run.outputs.ok == 'true'
        run: |
          researcher render-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/researcher.sqlite researcher/feeds.json
          if git diff --staged --quiet; then
            echo "Keine Datenänderungen."
          else
            git commit -m "chore: intake #${NUM} [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Setup Pages
        if: steps.auth.outputs.authorized == 'true' && steps.run.outputs.ok == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages-Artifact
        if: steps.auth.outputs.authorized == 'true' && steps.run.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.auth.outputs.authorized == 'true' && steps.run.outputs.ok == 'true'
        uses: actions/deploy-pages@v5

      - name: Ergebnis kommentieren + Issue schließen
        if: always() && steps.auth.outputs.authorized == 'true'
        run: |
          if [ "${{ steps.run.outputs.ok }}" = "true" ]; then
            {
              echo "✅ Erledigt (\`${{ steps.action.outputs.action }}\`)."
              if [ -n "${{ steps.run.outputs.slug }}" ]; then
                echo ""
                echo "Neue Seite: ${PAGES_BASE}/topics/${{ steps.run.outputs.slug }}.html"
              fi
            } > comment.md
          else
            {
              echo "❌ Fehlgeschlagen."
              echo ""
              echo '```'
              cat intake_output.txt 2>/dev/null || echo "(keine Ausgabe)"
              echo '```'
            } > comment.md
          fi
          gh issue comment "$NUM" --repo "$REPO" --body-file comment.md
          gh issue close "$NUM" --repo "$REPO"
