name: Build & Deploy Pages

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Digest erzwingen (ignoriert seen_entries, re-summiert die aktuellen Kandidaten)"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"   # jeden Montag 06:00 UTC

permissions:
  contents: write   # damit der Job die aktualisierte SQLite zurueckschreiben kann
  pages: write
  id-token: write
  actions: write    # fuer den automatischen Rerun bei transienten Deploy-Fehlern

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Node.js (fuer Brave-Search-MCP via npx)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Refresh research (re-recherchiert nur veraenderte Topics)
        # Einzelne Topics werden intern mit Retries behandelt (siehe researcher/agent.py);
        # schlägt eines davon dauerhaft fehl, soll das die anderen erfolgreich
        # aktualisierten Topics trotzdem committen und deployen lassen, statt den
        # kompletten Lauf abzubrechen.
        id: refresh
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: researcher refresh

      - name: Weekly security digest (Feeds scannen + Briefing erstellen)
        id: digest
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            researcher digest --force
          else
            researcher digest
          fi

      - name: Warnung sichtbar machen, falls Refresh/Digest fehlgeschlagen sind
        # continue-on-error oben verhindert, dass ein einzelner defekter Lauf den
        # kompletten Deploy blockiert - maskiert damit aber auch eine dauerhaft
        # fehlschlagende Recherche/Digest als grünen Workflow (siehe Ausfall
        # Juli-August 2026: 5 Wochen lang kein Refresh/Briefing, unbemerkt weil
        # der Schritt "erfolgreich" blieb). Diese Annotation macht es sichtbar,
        # ohne die Deploy-Toleranz selbst zu ändern.
        if: steps.refresh.outcome == 'failure' || steps.digest.outcome == 'failure'
        run: |
          if [ "${{ steps.refresh.outcome }}" = "failure" ]; then
            echo "::warning title=Refresh fehlgeschlagen::researcher refresh ist fehlgeschlagen - Topics wurden NICHT aktualisiert. Siehe Job-Log."
          fi
          if [ "${{ steps.digest.outcome }}" = "failure" ]; then
            echo "::warning title=Digest fehlgeschlagen::researcher digest ist fehlgeschlagen - kein neues Wochen-Briefing erstellt. Siehe Job-Log."
          fi

      - name: Commit aktualisierte DB (falls geaendert)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/researcher.sqlite
          if git diff --staged --quiet; then
            echo "Keine DB-Aenderungen."
          else
            git commit -m "chore: aktualisierte Quellen-Frische [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages-Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Bei transientem Deploy-Fehler automatisch neu versuchen
        # actions/deploy-pages schlägt gelegentlich transient fehl ("Deployment
        # failed, try again later.") - GitHub-seitiges Infra-Flackern, kein
        # Problem in unserem Artifact. Statt auf einen manuellen Rerun zu warten,
        # stossen wir automatisch (begrenzt auf 3 Versuche) einen Rerun der
        # fehlgeschlagenen Jobs an.
        if: failure() && fromJSON(github.run_attempt) < 3
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
