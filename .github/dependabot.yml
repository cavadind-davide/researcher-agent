version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      pages-actions:
        patterns:
          - "actions/*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "python"
    groups:
      # Minor/Patch sicher buendeln (uv.lock garantiert konsistente Aufloesung).
      # Major-Updates matchen diese Gruppe bewusst NICHT (update-types
      # beschraenkt auf minor/patch) und bekommen dadurch automatisch einen
      # eigenen PR statt im Sammel-PR unterzugehen - API-Bruch-Risiko soll
      # einzeln sichtbar und review-faehig bleiben.
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
